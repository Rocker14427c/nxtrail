<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Custom Tickets (Demo)</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Roboto, "Segoe UI", Arial, sans-serif; background:#eef1f7; color:#20242c; }
  .header { background:linear-gradient(135deg,#0d74e8,#2196f3); color:#fff; padding:18px 18px 22px; box-shadow:0 2px 8px rgba(0,0,0,.18); }
  .header h1 { margin:0; font-size:20px; font-weight:600; }
  .header p { margin:6px 0 0; font-size:12px; opacity:.92; }
  .wrap { padding:16px; max-width:560px; margin:0 auto 40px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(20,40,80,.08); }
  .card h2 { margin:0 0 12px; font-size:16px; color:#0d5fb8; }
  label { display:block; font-size:11px; letter-spacing:.4px; text-transform:uppercase; color:#607086; margin:10px 0 4px; }
  input, select { width:100%; padding:11px 12px; border:1px solid #cfd8e3; border-radius:9px; font-size:15px; background:#fbfcfe; color:#20242c; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; min-width:0; }
  button { border:0; border-radius:10px; padding:12px 16px; font-size:15px; font-weight:600; cursor:pointer; }
  .primary { background:#1565c0; color:#fff; width:100%; margin-top:16px; }
  .secondary { background:#e8f0fe; color:#0d5fb8; }
  .danger { background:#fdecea; color:#b3261e; }
  .note { font-size:12px; line-height:1.45; color:#7a4b00; background:#fff7e6; border:1px solid #ffe0a3; border-radius:9px; padding:10px 12px; margin-bottom:14px; }
  .ticket { border:1px solid #dce4ef; border-radius:12px; padding:12px; margin-top:10px; background:#fbfdff; }
  .ticket .top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .ticket .route { font-size:15px; font-weight:700; color:#1a2b45; }
  .ticket .meta { font-size:12px; color:#5c6b80; margin-top:4px; }
  .ticket .actions { display:flex; gap:8px; margin-top:10px; }
  .ticket .actions button { flex:1; padding:9px; font-size:13px; }
  .new-tag { display:inline-block; border:2px solid #1565c0; color:#0d5fb8; border-radius:999px; padding:2px 10px; font-size:10px; font-weight:800; letter-spacing:1.2px;  white-space:nowrap; }
  .active { display:inline-block; background:#e6f4ea; color:#137333; border-radius:999px; padding:3px 10px; font-size:11px; font-weight:700; }
  .empty { color:#6b7788; font-size:14px; padding:12px 0; }
</style>
</head>
<body>
<div class="header">
  <h1>Custom Tickets (Demo)</h1>
  <p>Create a labelled demo ticket · 5-minute dynamic preview · live QR</p>
</div>

<div class="wrap">
  <div class="note"><b>Demo only.</b> Every ticket carries a <span class="new-tag">new</span> tag and a “not valid for travel” note. It is stored locally on this device and is not an official booking.</div>

  <div class="card">
    <h2>New custom ticket</h2>
    <form id="f" onsubmit="return false;">
      <label>Passenger / greeting name</label>
      <input id="name" value="Test Passenger"/>

      <div class="row">
        <div><label>Source station</label><input id="source" value="SOURCE STN."/></div>
        <div><label>Destination station</label><input id="destination" value="DEST STN."/></div>
      </div>

      <div class="row">
        <div><label>Distance (km)</label><input id="distance" value="000 km"/></div>
        <div><label>Adults</label><input id="adults" value="2"/></div>
        <div><label>Children</label><input id="children" value="0"/></div>
      </div>

      <div class="row">
        <div><label>Ticket type</label><input id="ticketType" value="JOURNEY"/></div>
        <div><label>Train types</label><input id="trainTypes" value="MAIL/EXPRESS"/></div>
      </div>

      <div class="row">
        <div><label>Class</label><input id="klass" value="SECOND"/></div>
        <div><label>Fare</label><input id="fare" value="₹0.00"/></div>
      </div>

      <label>Via / identifier</label>
      <input id="via" value="-"/>

      <label>Booking date &amp; time</label>
      <input id="bookingDate" readonly/>

      <label>QR payload (optional)</label>
      <input id="qrText" value="CUSTOM-DEMO-TICKET"/>

      <button class="primary" onclick="createTicket()">Create custom ticket</button>
    </form>
  </div>

  <div class="card">
    <h2>My custom tickets</h2>
    <div id="list"></div>
  </div>
</div>

<script>
function esc(s) {
  s = (s === undefined || s === null) ? '' : String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function qs(id) { return document.getElementById(id).value; }
function encode(v) { return encodeURIComponent(v === undefined || v === null ? '' : v); }
function buildQuery() {
  var keys = ['name','source','destination','distance','adults','children','ticketType','trainTypes','klass','fare','via','qrText','bookingDate'];
  var parts = [];
  for (var i=0;i<keys.length;i++) { parts.push(keys[i] + '=' + encode(qs(keys[i]))); }
  return parts.join('&');
}
function nowString() {
  var d = new Date();
  return d.toLocaleString();
}
function createTicket() {
  var q = buildQuery();
  var id = '';
  try { id = Brerail.createTicket(q); } catch (e) { alert('Create failed: ' + e); return; }
  if (!id) { alert('Could not create ticket'); return; }
  try { Brerail.toast('Custom demo ticket created'); } catch (e) {}
  document.getElementById('f').reset();
  document.getElementById('name').value = 'Test Passenger';
  document.getElementById('source').value = 'SOURCE STN.';
  document.getElementById('destination').value = 'DEST STN.';
  document.getElementById('distance').value = '000 km';
  document.getElementById('adults').value = '2';
  document.getElementById('children').value = '0';
  document.getElementById('ticketType').value = 'JOURNEY';
  document.getElementById('trainTypes').value = 'MAIL/EXPRESS';
  document.getElementById('klass').value = 'SECOND';
  document.getElementById('fare').value = '₹0.00';
  document.getElementById('via').value = '-';
  document.getElementById('qrText').value = 'CUSTOM-DEMO-TICKET';
  document.getElementById('bookingDate').value = nowString();
  renderList();
}
function renderList() {
  var arr = [];
  try { arr = JSON.parse(Brerail.getTickets() || '[]'); } catch (e) { arr = []; }
  var el = document.getElementById('list');
  if (!arr.length) { el.innerHTML = '<div class="empty">No custom tickets yet. Tap + in the app, then create one here.</div>'; return; }
  var html = '';
  for (var i=arr.length-1;i>=0;i--) {
    var t = arr[i];
    html += '<div class="ticket">'
      + '<div class="top"><div class="route">' + esc(t.source) + ' → ' + esc(t.destination) + '</div>'
      + '<span class="new-tag">new</span></div>'
      + '<div class="meta">' + esc(t.id) + ' · ' + esc(t.bookingDate) + ' · <span class="active">ACTIVE</span></div>'
      + '<div class="actions">'
      + '<button class="secondary" onclick="openTicket(\'' + esc(t.id) + '\')">View dynamic preview</button>'
      + '<button class="danger" onclick="delTicket(\'' + esc(t.id) + '\')">Delete</button>'
      + '</div></div>';
  }
  el.innerHTML = html;
}
function openTicket(id) { try { Brerail.openTicket(id); } catch (e) { alert('Open failed: ' + e); } }
function delTicket(id) { try { Brerail.deleteTicket(id); } catch (e) {} renderList(); }
window.onload = function() {
  document.getElementById('bookingDate').value = nowString();
  renderList();
};
</script>
</body>
</html>
